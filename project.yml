name: SharedeCapture
options:
  bundleIdPrefix: com.sharedecapture
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 12.0
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: NO
targets:
  SharedeCapture:
    type: application
    platform: macOS
    sources:
      - path: SharedeCapture
    postBuildScripts:
      - name: Set version from git
        script: '"${SRCROOT}/scripts/set-bundle-version.sh"'
        # Declaring the processed Info.plist as input makes Xcode run this after it is written.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    info:
      path: SharedeCapture/Info.plist
      properties:
        CFBundleDisplayName: Sharedee Tools
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 Duy Chu. Licensed under the Apache License 2.0.
        SharedeeRepositoryURL: https://github.com/dychu2307/sharedee-tools
        LSApplicationCategoryType: public.app-category.graphics-design
        LSUIElement: true
        NSScreenCaptureUsageDescription: Sharedee Tools needs Screen Recording permission to capture your screen.
        SharedeeGoogleOAuthClientID: $(SHAREDEE_GOOGLE_CLIENT_ID)
        SharedeeGoogleOAuthClientSecret: $(SHAREDEE_GOOGLE_CLIENT_SECRET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharedecapture.app
        # Fallback only: the build phase below sets the version from git (see scripts/version.sh).
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # The version script reads the git history, which the user-script sandbox blocks.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Sharedee Tools
        PRODUCT_MODULE_NAME: SharedeCapture
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: N7G6YX6888
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SHAREDEE_GOOGLE_CLIENT_ID: ""
        SHAREDEE_GOOGLE_CLIENT_SECRET: ""
  SharedeCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SharedeCaptureTests
    dependencies:
      - target: SharedeCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Sharedee Tools.app/Contents/MacOS/Sharedee Tools'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  SharedeCapture:
    build:
      targets:
        SharedeCapture: all
    test:
      targets:
        - SharedeCaptureTests
