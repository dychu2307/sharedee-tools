name: SharedeCapture
options:
  bundleIdPrefix: com.sharedecapture
settings:
  base:
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: 12.0
    ARCHS: arm64 x86_64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  SharedeCapture:
    type: application
    platform: macOS
    sources:
      - path: SharedeCapture
    info:
      path: SharedeCapture/Info.plist
      properties:
        CFBundleDisplayName: Sharedee Tools
        LSApplicationCategoryType: public.app-category.graphics-design
        LSUIElement: true
        NSScreenCaptureUsageDescription: Sharedee Tools cần quyền ghi màn hình để chụp ảnh màn hình.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sharedecapture.app
        PRODUCT_NAME: Sharedee Tools
        PRODUCT_MODULE_NAME: SharedeCapture
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SharedeCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SharedeCaptureTests
    dependencies:
      - target: SharedeCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SharedeCapture:
    build:
      targets:
        SharedeCapture: all
    test:
      targets:
        - SharedeCaptureTests
